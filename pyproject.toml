[project]
name = "reposicao-qts"
version = "0.1.0"
description = "Laboratório de segurança contra SQL Injection e XSS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
reposicao-qts = "reposicao_qts:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "security: testes de seguranca ofensiva e defensiva (OWASP)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*testclient.*:Warning",
]